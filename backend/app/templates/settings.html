{% extends "base.html" %}
{% block title %}Anahtarlar{% endblock %}
{% block content %}
<section class="mx-auto max-w-4xl px-4 sm:px-6 pt-8 sm:pt-12 pb-16" x-data="settingsView()">
  <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">API Anahtarları</h1>
  <p class="text-sm text-slate-500 mt-1">Şifreli saklanır.</p>

  <div class="mt-6 grid sm:grid-cols-2 gap-3">
    {% for p in providers %}
    <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h3 class="font-semibold truncate">{{ p.name }}</h3>
            {% if p.open_source %}<span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700">açık</span>{% endif %}
            {% if p.free_tier %}<span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-brand-50 text-brand-700">ücretsiz</span>{% endif %}
          </div>
          <div class="text-[11px] text-slate-400 mt-1 truncate font-mono">{{ p.default_model }}</div>
          <div class="text-xs mt-2 flex items-center gap-2">
            <span :class="status('{{ p.id }}') === 'aktif' ? 'text-emerald-600' : 'text-slate-400'" x-text="status('{{ p.id }}')"></span>
            <span class="font-mono text-slate-400 text-[11px]" x-text="masked('{{ p.id }}')"></span>
          </div>
        </div>
        <a href="{{ p.docs_url }}" target="_blank" class="text-xs text-brand-600 hover:underline shrink-0">Al →</a>
      </div>

      <div class="mt-4 grid gap-2">
        <input type="password" x-model="inputs['{{ p.id }}']" placeholder="{{ p.key_hint }}"
          class="rounded-lg bg-slate-50 ring-1 ring-slate-200 focus:ring-brand-400 focus:ring-2 px-3 py-2 text-sm font-mono outline-none" />
        <select x-model="models['{{ p.id }}']" class="rounded-lg bg-slate-50 ring-1 ring-slate-200 px-2 py-2 text-xs">
          <option value="">{{ p.default_model }}</option>
          {% for m in p.models %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
        </select>
        <div class="flex gap-2">
          <button @click="save('{{ p.id }}')" class="flex-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2">Kaydet</button>
          <button x-show="status('{{ p.id }}') === 'aktif'" @click="remove('{{ p.id }}')" class="rounded-lg ring-1 ring-slate-200 hover:bg-slate-50 text-slate-600 text-sm px-3 py-2">Sil</button>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</section>

<script>
  function settingsView() {
    return {
      keys: [], inputs: {}, models: {},
      async init() { await this.load(); },
      async load() { this.keys = await window.app.api('/api/settings/keys'); },
      status(id) { return this.keys.find(k => k.provider === id && k.has_value) ? 'aktif' : ''; },
      masked(id)  { const k = this.keys.find(k => k.provider === id); return k ? k.masked : ''; },
      async save(id) {
        const value = (this.inputs[id] || '').trim();
        if (!value) return;
        await window.app.api(`/api/settings/keys/${id}`, {
          method: 'PUT', body: JSON.stringify({ value, model: this.models[id] || null }),
        });
        this.inputs[id] = '';
        await this.load();
      },
      async remove(id) {
        if (!confirm('Sil?')) return;
        await window.app.api(`/api/settings/keys/${id}`, { method: 'DELETE' });
        await this.load();
      },
    };
  }
</script>
{% endblock %}
