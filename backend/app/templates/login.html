{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block content %}
<section class="mx-auto max-w-sm px-5 pt-16 pb-12" x-data="loginForm()">
  <a href="/" class="text-xs text-slate-500 hover:text-slate-700">← Ana</a>
  <h1 class="text-2xl font-bold mt-5">Giriş</h1>

  <form @submit.prevent="submit" class="mt-6 space-y-3">
    <input type="email" x-model="email" required autocomplete="email" placeholder="E-posta"
      class="w-full rounded-xl bg-white ring-1 ring-slate-200 focus:ring-brand-400 focus:ring-2 px-4 py-3 outline-none" />
    <input type="password" x-model="password" required autocomplete="current-password" placeholder="Parola"
      class="w-full rounded-xl bg-white ring-1 ring-slate-200 focus:ring-brand-400 focus:ring-2 px-4 py-3 outline-none" />
    <button type="submit" :disabled="loading"
      class="w-full rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-50 text-white font-medium py-3">
      <span x-show="!loading">Giriş</span><span x-show="loading">…</span>
    </button>
    <p x-show="error" x-text="error" class="text-sm text-rose-600"></p>
  </form>

  <div class="mt-6 text-center text-sm text-slate-500">
    Hesabın yok mu? <a href="/register" class="text-brand-600 hover:underline">Kayıt ol</a>
  </div>
</section>

<script>
  function loginForm() {
    return {
      email: '', password: '', loading: false, error: '',
      async submit() {
        this.loading = true; this.error = '';
        try {
          await window.app.api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: this.email, password: this.password }) });
          window.location.href = '/dashboard';
        } catch (e) { this.error = e.message || 'Giriş başarısız'; }
        finally { this.loading = false; }
      }
    };
  }
</script>
{% endblock %}
