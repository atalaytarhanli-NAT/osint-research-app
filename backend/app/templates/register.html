{% extends "base.html" %}
{% block title %}Kayıt — OSINT Research{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-6 pt-20" x-data="registerForm()">
  <a href="/" class="text-sm text-slate-400 hover:text-slate-200">← Anasayfa</a>
  <h1 class="text-3xl font-bold mt-6">Yeni hesap</h1>
  {% if not registration_open %}
    <p class="mt-4 text-amber-400">Kayıtlar şu anda kapalı.</p>
  {% else %}
  <p class="text-sm text-slate-400 mt-1">Hesabın varsa <a href="/login" class="text-brand-300 underline">giriş yap</a>.</p>
  <form @submit.prevent="submit" class="mt-8 space-y-4">
    <div>
      <label class="text-xs uppercase tracking-wider text-slate-400">E-posta</label>
      <input type="email" x-model="email" required class="mt-1 w-full rounded-lg bg-white/5 border border-white/10 px-3 py-2 outline-none focus:border-brand-400" />
    </div>
    <div>
      <label class="text-xs uppercase tracking-wider text-slate-400">Görünür ad (opsiyonel)</label>
      <input type="text" x-model="display_name" class="mt-1 w-full rounded-lg bg-white/5 border border-white/10 px-3 py-2 outline-none focus:border-brand-400" />
    </div>
    <div>
      <label class="text-xs uppercase tracking-wider text-slate-400">Parola (en az 8 karakter)</label>
      <input type="password" x-model="password" required minlength="8" class="mt-1 w-full rounded-lg bg-white/5 border border-white/10 px-3 py-2 outline-none focus:border-brand-400" />
    </div>
    <button type="submit" :disabled="loading" class="w-full rounded-lg bg-brand-500 hover:bg-brand-400 text-slate-950 font-semibold py-2.5">
      <span x-show="!loading">Hesap oluştur</span><span x-show="loading">…</span>
    </button>
    <p x-show="error" x-text="error" class="text-sm text-red-400"></p>
  </form>
  {% endif %}
</section>
<script>
  function registerForm() {
    return {
      email: '', password: '', display_name: '', loading: false, error: '',
      async submit() {
        this.loading = true; this.error = '';
        try {
          await window.app.api('/api/auth/register', { method: 'POST', body: JSON.stringify({
            email: this.email, password: this.password, display_name: this.display_name || null,
          }) });
          window.location.href = '/dashboard';
        } catch (e) { this.error = e.message || 'Kayıt başarısız'; }
        finally { this.loading = false; }
      }
    };
  }
</script>
{% endblock %}
