{% extends "base.html" %}
{% block title %}Kayıt{% endblock %}
{% block content %}
<section class="mx-auto max-w-sm px-5 pt-16 pb-12" x-data="registerForm()">
  <a href="/" class="text-xs text-slate-500 hover:text-slate-700">← Ana</a>
  <h1 class="text-2xl font-bold mt-5">Yeni hesap</h1>

  {% if not registration_open %}
    <p class="mt-4 text-amber-600 text-sm">Kayıtlar şu anda kapalı.</p>
  {% else %}
  <form @submit.prevent="submit" class="mt-6 space-y-3">
    <input type="email" x-model="email" required placeholder="E-posta"
      class="w-full rounded-xl bg-white ring-1 ring-slate-200 focus:ring-brand-400 focus:ring-2 px-4 py-3 outline-none" />
    <input type="text" x-model="display_name" placeholder="İsim (opsiyonel)"
      class="w-full rounded-xl bg-white ring-1 ring-slate-200 focus:ring-brand-400 focus:ring-2 px-4 py-3 outline-none" />
    <input type="password" x-model="password" required minlength="8" placeholder="Parola (min 8)"
      class="w-full rounded-xl bg-white ring-1 ring-slate-200 focus:ring-brand-400 focus:ring-2 px-4 py-3 outline-none" />
    <button type="submit" :disabled="loading"
      class="w-full rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-50 text-white font-medium py-3">
      <span x-show="!loading">Hesap aç</span><span x-show="loading">…</span>
    </button>
    <p x-show="error" x-text="error" class="text-sm text-rose-600"></p>
  </form>

  <div class="mt-6 text-center text-sm text-slate-500">
    Hesabın var mı? <a href="/login" class="text-brand-600 hover:underline">Giriş</a>
  </div>
  {% endif %}
</section>

<script>
  function registerForm() {
    return {
      email: '', password: '', display_name: '', loading: false, error: '',
      async submit() {
        this.loading = true; this.error = '';
        try {
          await window.app.api('/api/auth/register', { method: 'POST', body: JSON.stringify({
            email: this.email, password: this.password, display_name: this.display_name || null,
          }) });
          window.location.href = '/dashboard';
        } catch (e) { this.error = e.message || 'Kayıt başarısız'; }
        finally { this.loading = false; }
      }
    };
  }
</script>
{% endblock %}
