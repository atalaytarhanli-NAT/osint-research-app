{% extends "base.html" %}
{% block title %}Rapor{% endblock %}
{% block content %}
<section class="mx-auto max-w-7xl px-4 sm:px-6 pt-6 sm:pt-10 pb-16" x-data="reportView({{ job_id }})" x-init="poll()">
  <a href="/dashboard" class="text-xs text-slate-500 hover:text-slate-700">← Panel</a>

  <div x-show="!job" class="mt-12 text-center text-slate-400 text-sm">Yükleniyor…</div>

  <template x-if="job">
    <div class="mt-3">
      <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight break-words" x-text="job.target"></h1>
        <span class="text-[11px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-100 text-slate-600" x-text="job.kind"></span>
        <span :class="statusClass(job.status)" class="text-[11px] uppercase font-medium tracking-wider" x-text="job.status"></span>
        <span class="ml-auto text-[11px] text-slate-400 font-mono" x-text="job.used_llm || ''"></span>
      </div>

      <!-- progress -->
      <div x-show="job.status === 'pending' || job.status === 'running'" class="mt-6 rounded-2xl bg-white ring-1 ring-brand-200 p-5">
        <div class="flex items-center gap-3">
          <div class="size-2.5 rounded-full bg-brand-500 animate-pulse"></div>
          <div class="text-sm font-medium">Açık kaynaklarda taranıyor…</div>
        </div>
        <div class="mt-2 text-xs text-slate-500">Web · Wiki · Wayback · GitHub · HN · Reddit · Sosyal</div>
      </div>

      <!-- error -->
      <div x-show="job.status === 'error'" class="mt-6 rounded-2xl bg-rose-50 ring-1 ring-rose-200 p-5">
        <div class="font-medium text-rose-700 text-sm">Hata</div>
        <pre class="text-xs text-rose-600/80 mt-1 whitespace-pre-wrap" x-text="job.error"></pre>
      </div>

      <!-- ===== NATO/IC standardı kapsamlı Markdown brief (LLM varsa) ===== -->
      <template x-if="job.status === 'done' && intelligenceBrief">
        <div class="mt-6 rounded-2xl bg-gradient-to-br from-indigo-50 to-violet-50 ring-1 ring-indigo-200 overflow-hidden"
             x-data="{open: false}">
          <button @click="open = !open" class="w-full flex items-center justify-between gap-3 p-5 hover:bg-white/40 transition">
            <div class="flex items-center gap-3 text-left">
              <div class="size-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 grid place-items-center text-white font-bold text-sm shrink-0">⚡</div>
              <div class="min-w-0">
                <div class="text-sm font-semibold text-indigo-900">Detaylı İstihbarat Raporu (NATO/IC standardı)</div>
                <div class="text-[11px] text-indigo-700/80 truncate">F3EAD · Admiralty Code · ACH · 13 bölüm — analyst-grade</div>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button @click.stop="copyBrief()" class="text-[11px] rounded-lg ring-1 ring-indigo-300 hover:bg-white px-2 py-1 text-indigo-700">Kopyala</button>
              <button @click.stop="downloadBrief()" class="text-[11px] rounded-lg ring-1 ring-indigo-300 hover:bg-white px-2 py-1 text-indigo-700">İndir</button>
              <svg :class="open ? 'rotate-180' : ''" class="size-4 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </button>
          <div x-show="open" x-transition class="border-t border-indigo-200 bg-white p-6">
            <article class="prose-osint" x-html="renderedBrief"></article>
          </div>
        </div>
      </template>

      <template x-if="job.status === 'done' && report">
        <div class="mt-6 grid lg:grid-cols-[1fr_280px] gap-5">
          <div class="space-y-4 min-w-0">
            <!-- A. Yönetici Özeti -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="flex items-center justify-between gap-2">
                <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">A · Özet</div>
                <div class="text-[11px] text-slate-500"><span x-text="sources.length"></span> kaynak</div>
              </div>
              <p class="mt-3 text-[15px] text-slate-800 leading-relaxed" x-html="renderWithCitations(report.executive_summary.overview)"></p>
              <ul class="mt-4 space-y-2 text-sm text-slate-700">
                <template x-for="(f,i) in report.executive_summary.top_findings" :key="i">
                  <li class="flex gap-2 items-start">
                    <span class="text-brand-500 shrink-0 mt-0.5">▸</span>
                    <span class="flex-1 min-w-0">
                      <span x-html="renderWithCitations(findingClaim(f))"></span>
                      <template x-if="findingVerification(f)">
                        <span class="ml-1.5 inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded"
                          :class="verifyClass(findingVerification(f))">
                          <span x-text="verifyIcon(findingVerification(f))"></span>
                          <span x-text="findingVerification(f)"></span>
                        </span>
                      </template>
                      <template x-if="(f.source_indices || []).length">
                        <span class="ml-1 text-[10px] text-slate-400">
                          <template x-for="(idx,j) in f.source_indices" :key="j"><a :href="`#src-${idx}`" class="font-mono mx-0.5 px-1 rounded bg-slate-100 hover:bg-brand-100 hover:text-brand-700" x-text="`[${idx}]`"></a></template>
                        </span>
                      </template>
                    </span>
                  </li>
                </template>
              </ul>
              <div class="mt-4 flex flex-wrap gap-2 text-xs">
                <div class="px-2.5 py-1 rounded-lg bg-slate-50 ring-1 ring-slate-200">
                  Güven: <span class="font-mono font-semibold" x-text="(report.executive_summary.confidence*100).toFixed(0)+'%'"></span>
                </div>
                <div class="px-2.5 py-1 rounded-lg" :class="riskClass(report.executive_summary.risk_level)">
                  Risk: <span class="font-mono font-semibold uppercase" x-text="report.executive_summary.risk_level"></span>
                </div>
              </div>
            </div>

            <!-- PIR Cevap Matrisi (NATO/IC) -->
            <div x-show="(report.pir_matrix || []).length" class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="flex items-center justify-between gap-2">
                <div class="text-[11px] uppercase tracking-widest text-indigo-600 font-semibold">PIR Cevap Matrisi</div>
                <span class="text-[10px] text-slate-400 font-mono">Priority Intelligence Requirements</span>
              </div>
              <p class="mt-1 text-[11px] text-slate-500">Araştırmanın cevaplaması gereken kritik soruların kaynak bazlı cevapları</p>
              <div class="mt-3 -mx-2 overflow-auto">
                <table class="w-full text-xs">
                  <thead class="text-slate-500">
                    <tr>
                      <th class="text-left px-2 py-1.5 w-12">PIR</th>
                      <th class="text-left px-2 py-1.5">Soru</th>
                      <th class="text-left px-2 py-1.5">Cevap</th>
                      <th class="text-left px-2 py-1.5 w-16">Güven</th>
                      <th class="text-left px-2 py-1.5">Kaynak</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(p,i) in report.pir_matrix" :key="i">
                      <tr class="border-t border-slate-100 align-top">
                        <td class="px-2 py-2 font-mono text-indigo-600 font-semibold" x-text="p.id"></td>
                        <td class="px-2 py-2 text-slate-700" x-text="p.question"></td>
                        <td class="px-2 py-2 text-slate-800" x-text="p.answer"></td>
                        <td class="px-2 py-2"><span class="font-mono text-[10px] px-1.5 py-0.5 rounded ring-1" :class="admiraltyClass(p.admiralty)" x-text="p.admiralty || '—'"></span></td>
                        <td class="px-2 py-2">
                          <template x-for="(idx,j) in (p.source_indices || [])" :key="j">
                            <a :href="`#src-${idx}`" class="font-mono text-[10px] mx-0.5 px-1 rounded bg-slate-100 hover:bg-brand-100 hover:text-brand-700 text-slate-500" x-text="`[${idx}]`"></a>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Admiralty Bulguları (NATO/IC) -->
            <div x-show="(report.admiralty_findings || []).length" class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="flex items-center justify-between gap-2">
                <div class="text-[11px] uppercase tracking-widest text-indigo-600 font-semibold">Admiralty Kodlu Bulgular</div>
                <span class="text-[10px] text-slate-400 font-mono">A-F × 1-6</span>
              </div>
              <p class="mt-1 text-[11px] text-slate-500">Her bulgu: kaynak güvenilirliği × bilgi doğruluğu (NATO standardı)</p>
              <ul class="mt-3 space-y-2">
                <template x-for="(a,i) in report.admiralty_findings" :key="i">
                  <li class="flex items-start gap-3 rounded-xl bg-slate-50 ring-1 ring-slate-200 p-2.5">
                    <span class="shrink-0 inline-flex items-center justify-center text-[11px] font-mono font-bold w-10 h-10 rounded-lg ring-1" :class="admiraltyClass(a.code)" x-text="a.code"></span>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm text-slate-800" x-text="a.finding"></div>
                      <div class="mt-1 flex flex-wrap items-center gap-1.5 text-[10px]">
                        <span class="px-1.5 py-0.5 rounded bg-white ring-1 ring-slate-200 text-slate-500 uppercase tracking-wider" x-text="a.vector || 'GENERAL'"></span>
                        <template x-for="(idx,j) in (a.source_indices || [])" :key="j">
                          <a :href="`#src-${idx}`" class="font-mono px-1 rounded bg-slate-100 hover:bg-brand-100 hover:text-brand-700 text-slate-500" x-text="`[${idx}]`"></a>
                        </template>
                      </div>
                    </div>
                  </li>
                </template>
              </ul>
            </div>

            <!-- Çapraz Doğrulama -->
            <div x-show="(report.cross_verification || []).length" class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">Çapraz Doğrulama</div>
              <p class="mt-1 text-[11px] text-slate-500">Her bulgunun kaç farklı bağımsız kaynak tarafından desteklendiği</p>
              <ul class="mt-3 space-y-2">
                <template x-for="(v,i) in report.cross_verification" :key="i">
                  <li class="flex items-start gap-3">
                    <span class="shrink-0 inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wider px-2 py-1 rounded-lg"
                      :class="verifyClass(v.level)">
                      <span x-text="verifyIcon(v.level)"></span>
                      <span x-text="v.level"></span>
                    </span>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm text-slate-800" x-text="v.claim"></div>
                      <div class="mt-1 flex flex-wrap gap-1 text-[10px]">
                        <template x-for="(idx,j) in v.source_indices" :key="j">
                          <a :href="`#src-${idx}`" class="font-mono px-1.5 py-0.5 rounded bg-slate-100 hover:bg-brand-100 hover:text-brand-700 text-slate-500" x-text="`[${idx}]`"></a>
                        </template>
                      </div>
                    </div>
                  </li>
                </template>
              </ul>
            </div>

            <!-- Bulunan Kaynaklar (LLM şeffaflığı: tüm kaynaklar burada) -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="flex flex-wrap items-center gap-2">
                <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">Bulunan Kaynaklar</div>
                <span class="text-xs text-slate-500" x-text="`${sources.length} sonuç`"></span>
                <div class="ml-auto flex flex-wrap gap-1.5">
                  <button @click="kindFilter=''" :class="kindFilter==='' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'" class="text-[11px] px-2 py-0.5 rounded-full">Tümü <span x-text="sources.length"></span></button>
                  <template x-for="(c,k) in groupCounts" :key="k">
                    <button @click="kindFilter = (kindFilter===k ? '' : k)"
                      :class="kindFilter===k ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                      class="text-[11px] px-2 py-0.5 rounded-full">
                      <span x-text="k"></span> <span class="font-semibold" x-text="c"></span>
                    </button>
                  </template>
                </div>
              </div>

              <div class="mt-3 grid sm:grid-cols-2 gap-2">
                <template x-for="(s,i) in visibleSources" :key="i">
                  <a :href="s.url" target="_blank" rel="noopener"
                    :id="`src-${s._idx}`"
                    class="group rounded-xl ring-1 ring-slate-200 hover:ring-brand-300 hover:shadow-sm bg-slate-50 p-3 transition">
                    <div class="flex items-center gap-2 text-[10px]">
                      <span class="font-mono text-slate-400">#<span x-text="s._idx"></span></span>
                      <span class="px-1.5 py-0.5 rounded bg-white ring-1 ring-slate-200 text-slate-600 uppercase tracking-wider" x-text="s.source"></span>
                      <span x-show="s.published_at" class="text-slate-400 ml-auto" x-text="s.published_at"></span>
                    </div>
                    <div class="mt-1.5 text-sm font-medium text-slate-800 group-hover:text-brand-700 line-clamp-2" x-text="s.title || s.url"></div>
                    <div x-show="s.snippet" class="mt-1 text-xs text-slate-500 line-clamp-2" x-text="s.snippet"></div>
                    <div class="mt-1 text-[10px] font-mono text-slate-400 truncate" x-text="s.url"></div>
                  </a>
                </template>
                <div x-show="visibleSources.length === 0" class="col-span-full text-center text-sm text-slate-400 py-6">
                  Bu filtrede sonuç yok
                </div>
              </div>

              <button x-show="!showAllSources && filteredSources.length > 12"
                @click="showAllSources = true"
                class="mt-3 w-full text-sm rounded-lg bg-slate-50 hover:bg-slate-100 ring-1 ring-slate-200 text-slate-700 py-2">
                Tümünü göster (<span x-text="filteredSources.length - 12"></span> daha)
              </button>
            </div>

            <!-- B. Kim/Ne -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">B · Kim / Ne</div>
              <p class="mt-3 text-sm text-slate-800" x-text="report.identity.definition"></p>
              <div class="mt-3 grid gap-1.5 text-xs">
                <div><span class="text-slate-500">Bağlam:</span> <span x-text="report.identity.context"></span></div>
                <div><span class="text-slate-500">Eş isim riski:</span> <span x-text="report.identity.name_collision_risk"></span></div>
              </div>
              <ul class="mt-3 text-sm text-slate-700 list-disc list-inside" x-show="report.identity.known_links?.length">
                <template x-for="(l,i) in report.identity.known_links" :key="i"><li x-text="l"></li></template>
              </ul>
            </div>

            <!-- C. Dijital İz -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">C · Dijital İz</div>
              <dl class="mt-3 grid sm:grid-cols-2 gap-2 text-sm">
                <template x-for="(v,k) in report.digital_footprint" :key="k">
                  <div class="rounded-xl bg-slate-50 p-3">
                    <dt class="text-[10px] uppercase tracking-wider text-slate-500" x-text="k"></dt>
                    <dd class="mt-1 text-slate-800" x-text="v"></dd>
                  </div>
                </template>
              </dl>
            </div>

            <!-- D. Zaman Çizelgesi -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">D · Zaman Çizelgesi</div>
              <ol class="mt-3 relative border-l-2 border-slate-100 ml-2 space-y-3">
                <template x-for="(e,i) in report.timeline" :key="i">
                  <li class="ml-4 relative">
                    <div class="absolute -left-[22px] top-1.5 size-2.5 rounded-full bg-brand-500 ring-4 ring-white"></div>
                    <div class="text-[11px] font-mono text-brand-600" x-text="e.date"></div>
                    <div class="text-sm text-slate-800" x-text="e.event"></div>
                  </li>
                </template>
                <li x-show="report.timeline.length===0" class="ml-4 text-slate-400 text-sm">Tarihli bulgu yok</li>
              </ol>
            </div>

            <!-- E. İlişki -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">E · İlişkiler</div>
              <div class="mt-3 grid sm:grid-cols-2 gap-2">
                <template x-for="(r,i) in report.relations" :key="i">
                  <div class="rounded-xl bg-slate-50 p-3 text-sm">
                    <div class="font-medium text-slate-800 truncate" x-text="r.entity"></div>
                    <div class="text-xs text-slate-500 truncate" x-text="r.relation"></div>
                    <div class="text-[10px] uppercase tracking-wider mt-1" :class="strengthClass(r.strength)" x-text="r.strength"></div>
                  </div>
                </template>
                <div x-show="report.relations.length===0" class="text-slate-400 text-sm">İlişki yok</div>
              </div>
            </div>

            <!-- F. İçerik -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">F · İçerik</div>
              <div class="mt-3 grid sm:grid-cols-2 gap-2 text-sm">
                <div class="rounded-xl bg-slate-50 p-3">
                  <div class="text-[10px] uppercase tracking-wider text-slate-500">Ana iddia</div>
                  <div class="mt-0.5 text-slate-800" x-text="report.content_analysis.main_claim"></div>
                </div>
                <div class="rounded-xl bg-slate-50 p-3">
                  <div class="text-[10px] uppercase tracking-wider text-slate-500">Ton</div>
                  <div class="mt-0.5 text-slate-800" x-text="report.content_analysis.tone"></div>
                </div>
                <div class="rounded-xl bg-slate-50 p-3">
                  <div class="text-[10px] uppercase tracking-wider text-slate-500">Manipülasyon</div>
                  <div class="mt-0.5 text-slate-800" x-text="report.content_analysis.manipulation_risk"></div>
                </div>
                <div class="rounded-xl bg-slate-50 p-3">
                  <div class="text-[10px] uppercase tracking-wider text-slate-500">Doğrulanabilirlik</div>
                  <div class="mt-0.5 font-mono text-slate-800" x-text="(report.content_analysis.verifiability*100).toFixed(0)+'%'"></div>
                </div>
              </div>
            </div>

            <!-- G. Risk -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">G · Risk</div>
              <dl class="mt-3 grid sm:grid-cols-2 gap-2 text-sm">
                <template x-for="(v,k) in report.risk" :key="k">
                  <div class="rounded-xl bg-slate-50 p-3">
                    <dt class="text-[10px] uppercase tracking-wider text-slate-500" x-text="k"></dt>
                    <dd class="mt-1 text-slate-800" x-text="v"></dd>
                  </div>
                </template>
              </dl>
            </div>

            <!-- Risk Matrisi (NATO/IC) -->
            <div x-show="(report.risk_matrix || []).length" class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="flex items-center justify-between gap-2">
                <div class="text-[11px] uppercase tracking-widest text-indigo-600 font-semibold">Risk Matrisi</div>
                <span class="text-[10px] text-slate-400 font-mono">Likelihood × Impact</span>
              </div>
              <p class="mt-1 text-[11px] text-slate-500">Spesifik risklerin olasılık-etki skoru ve mitigation önerileri</p>
              <div class="mt-3 -mx-2 overflow-auto">
                <table class="w-full text-xs">
                  <thead class="text-slate-500">
                    <tr>
                      <th class="text-left px-2 py-1.5">Risk</th>
                      <th class="text-left px-2 py-1.5 w-16">Kategori</th>
                      <th class="text-center px-2 py-1.5 w-12">L</th>
                      <th class="text-center px-2 py-1.5 w-12">I</th>
                      <th class="text-center px-2 py-1.5 w-14">Skor</th>
                      <th class="text-left px-2 py-1.5">Önlem</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(r,i) in report.risk_matrix" :key="i">
                      <tr class="border-t border-slate-100 align-top">
                        <td class="px-2 py-2 text-slate-800">
                          <span x-text="r.risk"></span>
                          <template x-if="(r.source_indices || []).length">
                            <span class="ml-1 text-[10px]">
                              <template x-for="(idx,j) in r.source_indices" :key="j">
                                <a :href="`#src-${idx}`" class="font-mono mx-0.5 px-1 rounded bg-slate-100 hover:bg-brand-100 hover:text-brand-700 text-slate-500" x-text="`[${idx}]`"></a>
                              </template>
                            </span>
                          </template>
                        </td>
                        <td class="px-2 py-2"><span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-100 text-slate-600" x-text="r.category"></span></td>
                        <td class="px-2 py-2 text-center font-mono" x-text="r.likelihood"></td>
                        <td class="px-2 py-2 text-center font-mono" x-text="r.impact"></td>
                        <td class="px-2 py-2 text-center"><span class="font-mono font-bold text-[11px] px-1.5 py-0.5 rounded" :class="riskScoreClass(r.score)" x-text="r.score"></span></td>
                        <td class="px-2 py-2 text-slate-700" x-text="r.mitigation"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- ACH (Çakışan Hipotezler Analizi) -->
            <div x-show="(report.ach_analysis?.hypotheses || []).length" class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="flex items-center justify-between gap-2">
                <div class="text-[11px] uppercase tracking-widest text-indigo-600 font-semibold">Çakışan Hipotezler (ACH)</div>

<script>
  function reportView(jobId) {
    return {
      jobId, job: null, report: null, sources: [], imgUrl: '',
      intelligenceBrief: '', renderedBrief: '',
      kindFilter: '', showAllSources: false,
      geopoints: [], _map: null,
      timer: null,
      async fetch() {
        try {
          this.job = await window.app.api(`/api/research/${this.jobId}`);
          if (this.job.result) {
            this.report = this.job.result.report;
            this.sources = (this.job.result.sources || []).map((s, i) => ({...s, _idx: i}));
            this.geopoints = this.job.result.geopoints || [];
            this.intelligenceBrief = this.job.result.intelligence_brief || '';
            this.$nextTick(() => this.renderMap());
            this.renderedBrief = this.intelligenceBrief
              ? DOMPurify.sanitize(marked.parse(this.intelligenceBrief))
              : '';
            // Mermaid diyagramları varsa render
            if (this.intelligenceBrief && window.mermaid) {
              try {
                window.mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
                this.$nextTick(() => {
                  document.querySelectorAll('.prose-osint pre code.language-mermaid, .prose-osint .language-mermaid').forEach((el, i) => {
                    const id = `mermaid-${this.jobId}-${i}`;
                    const code = el.textContent;
                    window.mermaid.render(id, code).then(({svg}) => {
                      const wrap = document.createElement('div');
                      wrap.innerHTML = svg;
                      el.replaceWith(wrap);
                    }).catch(() => {});
                  });
                });
              } catch {}
            }
          }
        } catch (e) {}
      },
      renderMap() {
        if (!this.geopoints.length || typeof L === 'undefined') return;
        const el = document.getElementById('osint-map');
        if (!el) return;
        if (this._map) { this._map.remove(); this._map = null; }
        const map = L.map(el, { scrollWheelZoom: false, attributionControl: true });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        const bounds = [];
        const colorByOrigin = {
          'wikidata': '#10b981', 'city': '#6366f1', 'ip': '#f59e0b', 'regex': '#ec4899',
        };
        this.geopoints.forEach((p) => {
          const primaryOrigin = (p.origins || []).find(o => /^(wikidata|ip|regex)/.test(o)) || (p.origins || [])[0] || 'city';
          const color = colorByOrigin[primaryOrigin.split(':')[0]] || '#6366f1';
          const marker = L.circleMarker([p.lat, p.lon], {
            radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.9,
          }).addTo(map);
          const srcLinks = (p.source_indices || []).slice(0, 5).map(i => `<a href="#src-${i}" style="color:#6366f1;font-family:monospace;text-decoration:none;margin-right:4px">[${i}]</a>`).join('');
          marker.bindPopup(
            `<strong style="font-size:13px;color:#1e293b">${this._escapeHtml(p.label)}</strong>` +
            `<div style="font-family:monospace;color:#64748b;font-size:11px;margin-top:2px">${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</div>` +
            `<div style="margin-top:4px;color:#475569;font-size:11px">Köken: ${(p.origins || []).join(', ')}</div>` +
            `<div style="margin-top:4px;font-size:11px">Kaynak: ${srcLinks || '—'}</div>`
          );
          bounds.push([p.lat, p.lon]);
        });
        if (bounds.length === 1) {
          map.setView(bounds[0], 8);
        } else {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
        }
        this._map = map;
        // Resize handler — Alpine bazen container 0px başlar
        setTimeout(() => map.invalidateSize(), 200);
      },
      _escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      },
      copyBrief() {
        if (!this.intelligenceBrief) return;
        navigator.clipboard.writeText(this.intelligenceBrief);
      },
      downloadBrief() {
        if (!this.intelligenceBrief) return;
        const blob = new Blob([this.intelligenceBrief], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `osint-brief-${this.jobId}.md`;
        a.click();
      },
      async poll() {
        await this.fetch();
        if (this.job && (this.job.status === 'pending' || this.job.status === 'running')) {
          this.timer = setTimeout(() => this.poll(), 2200);
        }
      },
      get groupCounts() {
        const c = {};
        for (const s of this.sources) c[s.kind] = (c[s.kind] || 0) + 1;
        return c;
      },
      get maxGroup() { return Math.max(1, ...Object.values(this.groupCounts)); },
      get filteredSources() {
        return this.kindFilter ? this.sources.filter(s => s.kind === this.kindFilter) : this.sources;
      },
      get visibleSources() {
        return this.showAllSources ? this.filteredSources : this.filteredSources.slice(0, 12);
      },
      renderWithCitations(text) {
        if (!text) return '';
        const escaped = String(text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return escaped.replace(/\[(\d+)\]/g, (m, n) => {
          const idx = parseInt(n, 10);
          if (idx < 0 || idx >= this.sources.length) return m;
          return `<a href="#src-${idx}" class="inline-flex items-center px-1 rounded bg-brand-50 text-brand-700 text-[11px] font-mono no-underline hover:bg-brand-100">[${idx}]</a>`;
        });
      },
      findingClaim(f)        { return typeof f === 'string' ? f : (f && f.claim) || ''; },
      findingVerification(f) { return typeof f === 'object' && f ? (f.verification || '') : ''; },
      verifyClass(level) {
        return ({
          triple:      'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200',
          double:      'bg-brand-50 text-brand-700 ring-1 ring-brand-200',
          single:      'bg-amber-50 text-amber-700 ring-1 ring-amber-200',
          conflicting: 'bg-rose-50 text-rose-700 ring-1 ring-rose-200',
          unverified:  'bg-slate-100 text-slate-500 ring-1 ring-slate-200',
        })[level] || 'bg-slate-100 text-slate-500';
      },
      verifyIcon(level) {
        return ({ triple: '✓✓✓', double: '✓✓', single: '✓', conflicting: '⚠', unverified: '•' })[level] || '';
      },
      admiraltyClass(code) {
        if (!code || typeof code !== 'string') return 'bg-slate-100 text-slate-500 ring-slate-200';
        const r = code.charAt(0).toUpperCase();
        if (r === 'A' || r === 'B') return 'bg-emerald-50 text-emerald-700 ring-emerald-200';
        if (r === 'C') return 'bg-brand-50 text-brand-700 ring-brand-200';
        if (r === 'D') return 'bg-amber-50 text-amber-700 ring-amber-200';
        if (r === 'E') return 'bg-rose-50 text-rose-700 ring-rose-200';
        return 'bg-slate-100 text-slate-500 ring-slate-200';
      },
      riskScoreClass(score) {
        const s = Number(score) || 0;
        if (s >= 15) return 'bg-rose-100 text-rose-700 ring-1 ring-rose-300';
        if (s >= 8)  return 'bg-amber-100 text-amber-700 ring-1 ring-amber-300';
        if (s >= 4)  return 'bg-yellow-50 text-yellow-700 ring-1 ring-yellow-200';
        return 'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200';
      },
      achVerdictClass(verdict) {
        return ({
          'destekli':  'bg-emerald-100 text-emerald-700',
          'zayıf':     'bg-amber-100 text-amber-700',
          'elendi':    'bg-rose-100 text-rose-700',
        })[verdict] || 'bg-slate-100 text-slate-500';
      },
      statusClass(s) { return ({ pending: 'text-amber-600', running: 'text-brand-600', done: 'text-emerald-600', error: 'text-rose-600' })[s] || ''; },
      riskClass(level) {
        return level === 'high' ? 'bg-rose-50 ring-1 ring-rose-200 text-rose-700' :
               level === 'medium' ? 'bg-amber-50 ring-1 ring-amber-200 text-amber-700' :
               'bg-emerald-50 ring-1 ring-emerald-200 text-emerald-700';
      },
      strengthClass(s) {
        return s === 'strong' ? 'text-emerald-600' :
               s === 'weak' ? 'text-amber-600' : 'text-slate-400';
      },
      downloadJson() {
        const blob = new Blob([JSON.stringify({ job: this.job, sources: this.sources, report: this.report }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `osint-${this.jobId}.json`;
        a.click();
      },
      copyMarkdown() {
        const r = this.report; if (!r) return;
        const findingLine = f => {
          const claim = this.findingClaim(f);
          const v = this.findingVerification(f);
          const idx = (typeof f === 'object' && f && f.source_indices) ? ` ${f.source_indices.map(i=>`[${i}]`).join('')}` : '';
          return `- ${claim}${v ? ` (${v})` : ''}${idx}`;
        };
        const md = [
          `# ${this.job.target}`, ``,
          `**Risk:** ${r.executive_summary.risk_level} · **Güven:** ${(r.executive_summary.confidence*100).toFixed(0)}%`, ``,
          r.executive_summary.overview, ``,
          ...r.executive_summary.top_findings.map(findingLine), ``,
          `## Sonuç`, r.conclusion,
        ].join('\n');
        navigator.clipboard.writeText(md);
      },
    };
  }
</script>
