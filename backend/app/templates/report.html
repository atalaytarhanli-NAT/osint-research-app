{% extends "base.html" %}
{% block title %}Rapor{% endblock %}
{% block nav %}{% if not embed %}{{ super() }}{% endif %}{% endblock %}
{% block content %}
<section class="{% if embed %}px-4 pt-2 pb-8{% else %}mx-auto max-w-7xl px-4 sm:px-6 pt-6 sm:pt-10 pb-16{% endif %}" x-data="reportView({{ job_id }})" x-init="poll()">
  {% if not embed %}
  <a href="/dashboard" class="text-xs text-slate-500 hover:text-slate-700">← Panel</a>
  {% endif %}

  <div x-show="!job" class="mt-12 text-center text-slate-400 text-sm">Yükleniyor…</div>

  <template x-if="job">
    <div class="mt-3">
      <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight break-words" x-text="job.target"></h1>
        <span class="text-[11px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-100 text-slate-600" x-text="job.kind"></span>
        <span :class="statusClass(job.status)" class="text-[11px] uppercase font-medium tracking-wider" x-text="job.status"></span>
        <span class="ml-auto text-[11px] text-slate-400 font-mono" x-text="job.used_llm || ''"></span>
      </div>

      <!-- progress -->
      <div x-show="job.status === 'pending' || job.status === 'running'" class="mt-6 rounded-2xl bg-white ring-1 ring-brand-200 p-5">
        <div class="flex items-center gap-3">
          <div class="size-2.5 rounded-full bg-brand-500 animate-pulse"></div>
          <div class="text-sm font-medium">Açık kaynaklarda taranıyor…</div>
        </div>
        <div class="mt-2 text-xs text-slate-500">Web · Wiki · Wayback · GitHub · HN · Reddit · Sosyal</div>
      </div>

      <!-- error -->
      <div x-show="job.status === 'error'" class="mt-6 rounded-2xl bg-rose-50 ring-1 ring-rose-200 p-5">
        <div class="font-medium text-rose-700 text-sm">Hata</div>
        <pre class="text-xs text-rose-600/80 mt-1 whitespace-pre-wrap" x-text="job.error"></pre>
      </div>

      <!-- ===== HEMEN CEVAP — Tek bakışta sonuç ===== -->
      <template x-if="job.status === 'done' && report">
        <div class="mt-6 rounded-2xl bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 text-white p-6 sm:p-8 ring-1 ring-slate-700 shadow-xl">
          <div class="grid sm:grid-cols-[1fr_auto] gap-6">
            <div class="min-w-0">
              <div class="text-[10px] uppercase tracking-[0.2em] text-indigo-300 font-semibold">Hemen Cevap</div>
              <h2 class="mt-1 text-2xl sm:text-3xl font-bold tracking-tight break-words" x-text="job.target"></h2>
              <!-- Identity definition (kim/ne) — büyük tek satır -->
              <p x-show="report.identity?.definition" class="mt-2 text-base sm:text-lg text-white leading-snug" x-text="report.identity.definition"></p>
              <!-- Executive overview tamamı (line-clamp YOK) -->
              <p class="mt-3 text-sm text-slate-300 leading-relaxed" x-html="renderWithCitations(report.executive_summary.overview)"></p>
            </div>

            <!-- Sağ: Risk + Güven dial -->
            <div class="flex sm:flex-col items-center gap-4 sm:gap-3 sm:min-w-[160px]">
              <div class="relative size-28 sm:size-32 shrink-0">
                <svg class="absolute inset-0" viewBox="0 0 36 36">
                  <path d="M18 2.5 a 15.5 15.5 0 0 1 0 31 a 15.5 15.5 0 0 1 0 -31" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
                  <path :d="'M18 2.5 a 15.5 15.5 0 0 1 0 31 a 15.5 15.5 0 0 1 0 -31'"
                    fill="none" stroke="url(#conf-gradient)" stroke-width="3" stroke-linecap="round"
                    :stroke-dasharray="`${(report.executive_summary.confidence*100).toFixed(0)} 100`"/>
                  <defs>
                    <linearGradient id="conf-gradient" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#10b981"/>
                      <stop offset="100%" stop-color="#6366f1"/>
                    </linearGradient>
                  </defs>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                  <div class="text-2xl font-bold font-mono" x-text="(report.executive_summary.confidence*100).toFixed(0)"></div>
                  <div class="text-[9px] uppercase tracking-wider text-indigo-300/80">Güven</div>
                </div>
              </div>
              <div class="flex flex-col items-center">
                <div class="text-[10px] uppercase tracking-wider text-indigo-300/80 mb-1">Risk Seviyesi</div>
                <div class="px-4 py-1.5 rounded-full text-sm font-bold uppercase tracking-wider"
                     :class="riskHeroClass(report.executive_summary.risk_level)"
                     x-text="report.executive_summary.risk_level"></div>
                <div class="text-[10px] text-slate-400 mt-1.5">
                  <span x-text="sources.length"></span> kaynak ·
                  <span x-text="(report.admiralty_findings || []).length"></span> kodlu bulgu
                </div>
              </div>
            </div>
          </div>

          <!-- KRİTİK BULGULAR — büyük kart liste hero altında -->
          <div x-show="(report.executive_summary?.top_findings || []).length" class="mt-6 pt-6 border-t border-white/10">
            <div class="text-[10px] uppercase tracking-[0.2em] text-indigo-300 font-semibold mb-3">Kritik Bulgular</div>
            <ul class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
              <template x-for="(f,i) in (report.executive_summary.top_findings || []).slice(0, 6)" :key="i">
                <li class="rounded-xl bg-white/5 ring-1 ring-white/10 p-3.5 hover:bg-white/10 transition">
                  <div class="flex items-center gap-1.5 mb-2">
                    <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ring-1"
                      :class="findingVerification(f) === 'triple' ? 'bg-emerald-500/20 text-emerald-300 ring-emerald-400/30' :
                              findingVerification(f) === 'double' ? 'bg-brand-500/20 text-brand-300 ring-brand-400/30' :
                              findingVerification(f) === 'single' ? 'bg-amber-500/20 text-amber-300 ring-amber-400/30' :
                              'bg-slate-500/20 text-slate-300 ring-slate-400/30'">
                      <span x-text="findingVerification(f) || 'kayıt'"></span>
                    </span>
                    <span class="text-[10px] text-slate-400 ml-auto">
                      <template x-for="(idx,j) in (f.source_indices || []).slice(0,3)" :key="j"><a :href="`#src-${idx}`" class="font-mono mx-0.5 px-1 rounded bg-white/5 hover:bg-white/15" x-text="`[${idx}]`"></a></template>
                    </span>
                  </div>
                  <p class="text-sm text-white leading-snug" x-html="renderWithCitations(findingClaim(f))"></p>
                </li>
              </template>
            </ul>
          </div>

          <!-- PIR — hızlı bilgi şeritleri -->
          <div x-show="(report.pir_matrix || []).length" class="mt-6 pt-6 border-t border-white/10">
            <div class="text-[10px] uppercase tracking-[0.2em] text-indigo-300 font-semibold mb-3">Hızlı Bilgi (PIR)</div>
            <div class="space-y-2">
              <template x-for="(p,i) in (report.pir_matrix || []).slice(0, 5)" :key="i">
                <div class="flex items-start gap-3 text-sm">
                  <span class="font-mono text-[10px] font-bold text-indigo-300 shrink-0 mt-0.5 w-12" x-text="p.id"></span>
                  <div class="flex-1 min-w-0">
                    <div class="text-slate-300 text-xs" x-text="p.question"></div>
                    <div class="text-white mt-0.5" x-text="(p.answer || '')"></div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Vector dağılımı (kompakt, alt sırada) -->
          <div class="mt-6 pt-4 border-t border-white/10 flex flex-wrap gap-2">
            <template x-for="(c,k) in vectorCounts" :key="k">
              <div x-show="c > 0" class="text-[10px] flex items-center gap-1.5 px-2 py-1 rounded bg-white/5 ring-1 ring-white/10">
                <span class="uppercase tracking-wider text-indigo-300/80" x-text="k"></span>
                <span class="font-bold font-mono text-white" x-text="c"></span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===== Aday Görseller — kişi/kurum raporlarında, doğru kişiyi seçip yüz arama ===== -->
      <template x-if="job.status === 'done' && (job.kind === 'person' || job.kind === 'organization' || job.kind === 'auto')">
        <div class="mt-6 rounded-2xl bg-white ring-1 ring-amber-200 overflow-hidden"
             x-data="{open: false}">
          <button @click="open = !open; if (open && !imgCandidates.length) loadImageCandidates()"
            class="w-full flex items-center justify-between gap-3 p-5 hover:bg-amber-50/30 transition">
            <div class="flex items-center gap-3 text-left">
              <div class="size-9 rounded-xl bg-gradient-to-br from-amber-500 to-orange-500 grid place-items-center text-white font-bold text-sm shrink-0">📸</div>
              <div class="min-w-0">
                <div class="text-sm font-semibold text-amber-900">Aday Görseller (örnek resimler)</div>
                <div class="text-[11px] text-amber-700/80 truncate">Doğru kişiyi seç → o resimle yüz araması başlat</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span x-show="imgCandidates.length" class="text-[10px] font-mono text-amber-700" x-text="`${imgCandidates.length} aday`"></span>
              <svg :class="open ? 'rotate-180' : ''" class="size-4 text-amber-700 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </button>
          <div x-show="open" x-transition class="border-t border-amber-200 p-5 bg-amber-50/10">
            <div x-show="imgCandidatesBusy" class="text-center text-xs text-slate-500 py-6">
              Aday görseller aranıyor (Bing/DDG)…
            </div>
            <div x-show="!imgCandidatesBusy && imgCandidates.length === 0" class="rounded-lg bg-amber-50 ring-1 ring-amber-200 p-3 text-xs text-amber-800">
              Aday görsel bulunamadı (Render IP'leri image search'te captcha alabilir).
              Manuel olarak yukarıdaki "Görsel ters arama" sekmesinden URL/dosya ile yüz araması yapabilirsin.
            </div>
            <div x-show="!imgCandidatesBusy && imgCandidates.length > 0">
              <p class="text-xs text-slate-600 mb-3">
                Aşağıdaki resimlerden hedefe ait olduğunu düşündüğünü <strong>tıkla</strong>:
                o görselle 10 dış adaptör paralel yüz araması başlatılır.
              </p>
              <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-2">
                <template x-for="(c, i) in imgCandidates" :key="i">
                  <button type="button" @click="selectCandidate(c)" :disabled="faceSearchBusy"
                    class="group relative aspect-square rounded-lg overflow-hidden ring-2 ring-transparent hover:ring-amber-500 hover:shadow-md transition bg-slate-100 disabled:opacity-50"
                    :class="selectedCandidate?.full_url === c.full_url ? 'ring-amber-500 shadow-md' : ''">
                    <img :src="c.thumb_url" referrerpolicy="no-referrer" loading="lazy"
                      class="w-full h-full object-cover" />
                    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-1.5">
                      <span class="text-[9px] text-white font-mono uppercase" x-text="c.engine"></span>
                    </div>
                    <div x-show="selectedCandidate?.full_url === c.full_url" class="absolute top-1 right-1 size-5 rounded-full bg-amber-500 grid place-items-center text-white text-[10px] font-bold">✓</div>
                  </button>
                </template>
              </div>
              <div x-show="selectedCandidate" class="mt-4 flex flex-col sm:flex-row items-start gap-3 rounded-lg bg-white ring-1 ring-amber-200 p-3">
                <img x-show="selectedCandidate?.thumb_url" :src="selectedCandidate?.thumb_url" referrerpolicy="no-referrer"
                  class="size-16 sm:size-24 object-cover rounded-md ring-1 ring-slate-200 shrink-0" />
                <div class="flex-1 min-w-0">
                  <div class="text-xs font-semibold text-slate-700" x-text="selectedCandidate?.title || '(başlıksız)'"></div>
                  <div class="text-[10px] text-slate-400 font-mono truncate mt-0.5" x-text="selectedCandidate?.source_url || selectedCandidate?.full_url"></div>
                  <button @click="runFaceSearchFromCandidate()" :disabled="faceSearchBusy"
                    class="mt-2 rounded-lg bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 disabled:opacity-50 text-white font-medium px-4 py-2 text-sm">
                    <span x-show="!faceSearchBusy">🔍 Bu Resimle Yüz Araması Başlat</span>
                    <span x-show="faceSearchBusy">Aranıyor…</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ===== Daha Derin Analiz — iteratif derinleştirme formu ===== -->
      <template x-if="job.status === 'done' && report">
        <div class="mt-6 rounded-2xl bg-white ring-1 ring-emerald-200 overflow-hidden"
             x-data="{open: false}">
          <button @click="open = !open" class="w-full flex items-center justify-between gap-3 p-5 hover:bg-emerald-50/30 transition">
            <div class="flex items-center gap-3 text-left">
              <div class="size-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-500 grid place-items-center text-white font-bold text-sm shrink-0">+</div>
              <div class="min-w-0">
                <div class="text-sm font-semibold text-emerald-900">Daha Derin Analiz</div>
                <div class="text-[11px] text-emerald-700/80 truncate">Ek bilgiler ekle (kullanıcı adı, e-posta, kurum, şehir...) → daha hedefli rapor</div>
              </div>
            </div>
            <svg :class="open ? 'rotate-180' : ''" class="size-4 text-emerald-700 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div x-show="open" x-transition class="border-t border-emerald-200 p-5 bg-emerald-50/20">
            <p class="text-xs text-slate-600 mb-4">
              Bu sonuç doğru kişi/kurumla ilgili mi? Aşağıya ek bilgi ekleyerek daha hedefli yeni bir
              arama başlatabilirsin. Eklediğin bilgiler arama sorgusuna katılır, eş isim çakışmasını
              azaltır.
            </p>
            <div class="grid sm:grid-cols-2 gap-3">
              <div>
                <label class="text-[11px] font-medium text-slate-600 uppercase tracking-wider">Kullanıcı adı / Handle</label>
                <input type="text" x-model="refine.handle" placeholder="@kullaniciadi"
                  class="mt-1 w-full rounded-lg ring-1 ring-slate-200 focus:ring-emerald-400 focus:ring-2 px-3 py-2 text-sm outline-none" />
              </div>
              <div>
                <label class="text-[11px] font-medium text-slate-600 uppercase tracking-wider">E-posta</label>
                <input type="email" x-model="refine.email" placeholder="x@y.com"
                  class="mt-1 w-full rounded-lg ring-1 ring-slate-200 focus:ring-emerald-400 focus:ring-2 px-3 py-2 text-sm outline-none" />
              </div>
              <div>
                <label class="text-[11px] font-medium text-slate-600 uppercase tracking-wider">Kurum / Şirket</label>
                <input type="text" x-model="refine.organization" placeholder="TAV Güvenlik AŞ"
                  class="mt-1 w-full rounded-lg ring-1 ring-slate-200 focus:ring-emerald-400 focus:ring-2 px-3 py-2 text-sm outline-none" />
              </div>
              <div>
                <label class="text-[11px] font-medium text-slate-600 uppercase tracking-wider">Şehir / Ülke</label>
                <input type="text" x-model="refine.location" placeholder="İstanbul, Türkiye"
                  class="mt-1 w-full rounded-lg ring-1 ring-slate-200 focus:ring-emerald-400 focus:ring-2 px-3 py-2 text-sm outline-none" />
              </div>
              <div>
                <label class="text-[11px] font-medium text-slate-600 uppercase tracking-wider">Telefon</label>
                <input type="tel" x-model="refine.phone" placeholder="+90 5XX XXX XX XX"
                  class="mt-1 w-full rounded-lg ring-1 ring-slate-200 focus:ring-emerald-400 focus:ring-2 px-3 py-2 text-sm outline-none" />
              </div>
              <div>
                <label class="text-[11px] font-medium text-slate-600 uppercase tracking-wider">Web sitesi / Domain</label>
                <input type="text" x-model="refine.domain" placeholder="example.com"
                  class="mt-1 w-full rounded-lg ring-1 ring-slate-200 focus:ring-emerald-400 focus:ring-2 px-3 py-2 text-sm outline-none" />
              </div>
            </div>
            <div class="mt-3">
              <label class="text-[11px] font-medium text-slate-600 uppercase tracking-wider">Ek bağlam / Not (serbest metin)</label>
              <textarea x-model="refine.note" rows="2" placeholder="Örn: Avukat, Gezi davası tutuklu vekil, ya da: 1985 İstanbul doğumlu mühendis..."
                class="mt-1 w-full rounded-lg ring-1 ring-slate-200 focus:ring-emerald-400 focus:ring-2 px-3 py-2 text-sm outline-none resize-none"></textarea>
            </div>
            <p x-show="refine.error" x-text="refine.error" class="mt-3 text-rose-600 text-sm"></p>
            <div class="mt-4 flex items-center gap-3 flex-wrap">
              <button @click="submitRefine()" :disabled="refine.busy"
                class="rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 disabled:opacity-50 text-white font-semibold px-5 py-2.5 text-sm shadow-md">
                <span x-show="!refine.busy">🔍 Bu Bilgilerle Yeniden Ara</span>
                <span x-show="refine.busy">Yeni rapor başlatılıyor…</span>
              </button>
              <span class="text-[11px] text-slate-500">
                <span x-show="refineCount > 0">En az <span x-text="refineCount"></span> alan dolduruldu — derinleştirme aktif.</span>
                <span x-show="refineCount === 0">Hiç değilse 1 alan doldur.</span>
              </span>
            </div>
          </div>
        </div>
      </template>

      <!-- ===== NATO/IC standardı kapsamlı Markdown brief (LLM varsa veya rule-based template) ===== -->
      <template x-if="job.status === 'done' && intelligenceBrief">
        <div class="mt-6 rounded-2xl bg-gradient-to-br from-indigo-50 to-violet-50 ring-1 ring-indigo-200 overflow-hidden"
             x-data="{open: true}">
          <button @click="open = !open" class="w-full flex items-center justify-between gap-3 p-5 hover:bg-white/40 transition">
            <div class="flex items-center gap-3 text-left">
              <div class="size-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 grid place-items-center text-white font-bold text-sm shrink-0">⚡</div>
              <div class="min-w-0">
                <div class="text-sm font-semibold text-indigo-900">Detaylı İstihbarat Raporu (NATO/IC standardı)</div>
                <div class="text-[11px] text-indigo-700/80 truncate">F3EAD · Admiralty Code · ACH · 13 bölüm — analyst-grade</div>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button @click.stop="copyBrief()" class="text-[11px] rounded-lg ring-1 ring-indigo-300 hover:bg-white px-2 py-1 text-indigo-700">Kopyala</button>
              <button @click.stop="downloadBrief()" class="text-[11px] rounded-lg ring-1 ring-indigo-300 hover:bg-white px-2 py-1 text-indigo-700">İndir</button>
              <svg :class="open ? 'rotate-180' : ''" class="size-4 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </button>
          <div x-show="open" x-transition class="border-t border-indigo-200 bg-white p-6">
            <article class="prose-osint" x-html="renderedBrief"></article>
          </div>
        </div>
      </template>

      <template x-if="job.status === 'done' && report">
        <div class="mt-6 grid lg:grid-cols-[1fr_280px] gap-5">
          <div class="space-y-4 min-w-0">
            <!-- A · Özet ve PIR özeti hero'ya taşındı (overview + top findings + dial hero'da) -->

            <!-- PIR Cevap Matrisi (NATO/IC) — DETAYLI tablo (Admiralty + kaynak link'leri ile) -->
            <div x-show="(report.pir_matrix || []).length" class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="flex items-center justify-between gap-2">
                <div class="text-[11px] uppercase tracking-widest text-indigo-600 font-semibold">PIR Cevap Matrisi (Detaylı)</div>
                <span class="text-[10px] text-slate-400 font-mono">Priority Intelligence Requirements</span>
              </div>
              <p class="mt-1 text-[11px] text-slate-500">Tam tablo — Admiralty kodu + kaynak link'leri ile</p>
              <div class="mt-3 -mx-2 overflow-auto">
                <table class="w-full text-xs">
            <div x-show="(report.pir_matrix || []).length" class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="flex items-center justify-between gap-2">
                <div class="text-[11px] uppercase tracking-widest text-indigo-600 font-semibold">PIR Cevap Matrisi</div>
                <span class="text-[10px] text-slate-400 font-mono">Priority Intelligence Requirements</span>
              </div>
              <p class="mt-1 text-[11px] text-slate-500">Araştırmanın cevaplaması gereken kritik soruların kaynak bazlı cevapları</p>
              <div class="mt-3 -mx-2 overflow-auto">
                <table class="w-full text-xs">
                  <thead class="text-slate-500">
                    <tr>
                      <th class="text-left px-2 py-1.5 w-12">PIR</th>
                      <th class="text-left px-2 py-1.5">Soru</th>
                      <th class="text-left px-2 py-1.5">Cevap</th>
                      <th class="text-left px-2 py-1.5 w-16">Güven</th>
                      <th class="text-left px-2 py-1.5">Kaynak</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(p,i) in report.pir_matrix" :key="i">
                      <tr class="border-t border-slate-100 align-top">
                        <td class="px-2 py-2 font-mono text-indigo-600 font-semibold" x-text="p.id"></td>
                        <td class="px-2 py-2 text-slate-700" x-text="p.question"></td>
                        <td class="px-2 py-2 text-slate-800" x-text="p.answer"></td>
                        <td class="px-2 py-2"><span class="font-mono text-[10px] px-1.5 py-0.5 rounded ring-1" :class="admiraltyClass(p.admiralty)" x-text="p.admiralty || '—'"></span></td>
                        <td class="px-2 py-2">
                          <template x-for="(idx,j) in (p.source_indices || [])" :key="j">

<script>
  function reportView(jobId) {
    return {
      jobId, job: null, report: null, sources: [], imgUrl: '',
      imgExif: null, imgUploading: false,
      imgFile: null, faceSearchBusy: false, faceResults: null,
      diagnostics: null, showDiag: false,
      pdfBusy: false,
      refine: { handle: '', email: '', organization: '', location: '', phone: '', domain: '', note: '', busy: false, error: '' },
      imgCandidates: [], imgCandidatesBusy: false, selectedCandidate: null,
      intelligenceBrief: '', renderedBrief: '',
      kindFilter: '', showAllSources: false,
      geopoints: [], _map: null,
      timer: null,
      async fetch() {
        try {
          this.job = await window.app.api(`/api/research/${this.jobId}`);
          if (this.job.result) {
            this.report = this.job.result.report;
            this.sources = (this.job.result.sources || []).map((s, i) => ({...s, _idx: i}));
            this.geopoints = this.job.result.geopoints || [];
            this.diagnostics = this.job.result.diagnostics || null;
            this.intelligenceBrief = this.job.result.intelligence_brief || '';
            this.$nextTick(() => this.renderMap());
            this.renderedBrief = this.intelligenceBrief
              ? DOMPurify.sanitize(marked.parse(this.intelligenceBrief))
              : '';
            // Mermaid diyagramları varsa render
            if (this.intelligenceBrief && window.mermaid) {
              try {
                window.mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
                this.$nextTick(() => {
                  document.querySelectorAll('.prose-osint pre code.language-mermaid, .prose-osint .language-mermaid').forEach((el, i) => {
                    const id = `mermaid-${this.jobId}-${i}`;
                    const code = el.textContent;
                    window.mermaid.render(id, code).then(({svg}) => {
                      const wrap = document.createElement('div');
                      wrap.innerHTML = svg;
                      el.replaceWith(wrap);
                    }).catch(() => {});
                  });
                });
              } catch {}
            }
          }
        } catch (e) {}
      },
      async uploadImage(event) {
        const file = event?.target?.files?.[0];
        if (!file) return;
        this.imgFile = file;  // face-search'te tekrar kullanılmak üzere sakla
        this.imgUploading = true;
        this.imgExif = null;
        try {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('ttl', '1h');
          const res = await fetch('/api/image/upload', { method: 'POST', body: fd, credentials: 'include' });
          if (!res.ok) {
            this.imgExif = { has_exif: false };
            return;
          }
          const data = await res.json();
          this.imgUrl = data.image_url || '';
          this.imgExif = data.exif || { has_exif: false };
          // Eğer GPS varsa harita'ya marker ekle
          if (this.imgExif?.gps && this._map && typeof L !== 'undefined') {
            const m = L.circleMarker([this.imgExif.gps.lat, this.imgExif.gps.lon], {
              radius: 10, color: '#fff', weight: 3, fillColor: '#ef4444', fillOpacity: 0.9
            }).addTo(this._map);
            m.bindPopup(`<strong>📷 EXIF GPS</strong><br/>${this.imgExif.camera || 'Kamera ?'}<br/>${this.imgExif.taken_at || ''}`);
            this._map.setView([this.imgExif.gps.lat, this.imgExif.gps.lon], 14);
          }
        } catch (e) {
          this.imgExif = { has_exif: false };
        } finally {
          this.imgUploading = false;
        }
      },
      renderMap() {
        if (!this.geopoints.length || typeof L === 'undefined') return;
        const el = document.getElementById('osint-map');
        if (!el) return;
        if (this._map) { this._map.remove(); this._map = null; }
        const map = L.map(el, { scrollWheelZoom: false, attributionControl: true });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        const bounds = [];
        const colorByOrigin = {
          'wikidata': '#10b981', 'city': '#6366f1', 'ip': '#f59e0b', 'regex': '#ec4899',
        };
        this.geopoints.forEach((p) => {
          const primaryOrigin = (p.origins || []).find(o => /^(wikidata|ip|regex)/.test(o)) || (p.origins || [])[0] || 'city';
          const color = colorByOrigin[primaryOrigin.split(':')[0]] || '#6366f1';
          const marker = L.circleMarker([p.lat, p.lon], {
            radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.9,
          }).addTo(map);
          const srcLinks = (p.source_indices || []).slice(0, 5).map(i => `<a href="#src-${i}" style="color:#6366f1;font-family:monospace;text-decoration:none;margin-right:4px">[${i}]</a>`).join('');
          marker.bindPopup(
            `<strong style="font-size:13px;color:#1e293b">${this._escapeHtml(p.label)}</strong>` +
            `<div style="font-family:monospace;color:#64748b;font-size:11px;margin-top:2px">${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</div>` +
            `<div style="margin-top:4px;color:#475569;font-size:11px">Köken: ${(p.origins || []).join(', ')}</div>` +
            `<div style="margin-top:4px;font-size:11px">Kaynak: ${srcLinks || '—'}</div>`
          );
          bounds.push([p.lat, p.lon]);
        });
        if (bounds.length === 1) {
          map.setView(bounds[0], 8);
        } else {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
        }
        this._map = map;
        // Resize handler — Alpine bazen container 0px başlar
        setTimeout(() => map.invalidateSize(), 200);
      },
      _escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      },
      copyBrief() {
        if (!this.intelligenceBrief) return;
        navigator.clipboard.writeText(this.intelligenceBrief);
      },
      downloadBrief() {
        if (!this.intelligenceBrief) return;
        const blob = new Blob([this.intelligenceBrief], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `osint-brief-${this.jobId}.md`;
        a.click();
      },
      async poll() {
        await this.fetch();
        if (this.job && (this.job.status === 'pending' || this.job.status === 'running')) {
          this.timer = setTimeout(() => this.poll(), 2200);
        }
      },
      get groupCounts() {
        const c = {};
        for (const s of this.sources) c[s.kind] = (c[s.kind] || 0) + 1;
        return c;
      },
      get vectorCounts() {
        // kind → NATO/IC vector mapping (analyzer.py _KIND_TO_ADMIRALTY ile uyumlu)
        const map = {
          'wiki': 'GENERAL', 'news': 'GENERAL', 'archive': 'GENERAL', 'web': 'GENERAL',
          'code': 'PERSINT', 'profile': 'PERSINT', 'social': 'PERSINT',
          'cybint': 'CORPINT', 'sanction': 'CORPINT', 'attack_surface': 'CORPINT',
          'financial': 'CORPINT', 'threat_exposure': 'CORPINT', 'corp_registry': 'CORPINT',
          'link_signal': 'LINKINT',
        };
        const counts = { 'PERSINT': 0, 'CORPINT': 0, 'LINKINT': 0, 'GENERAL': 0 };
        for (const s of this.sources) {
          const v = map[s.kind] || 'GENERAL';
          counts[v] = (counts[v] || 0) + 1;
        }
        return counts;
      },
      riskHeroClass(level) {
        return level === 'high'   ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/40' :
               level === 'medium' ? 'bg-amber-400 text-amber-900 shadow-lg shadow-amber-400/30' :
                                    'bg-emerald-400 text-emerald-900 shadow-lg shadow-emerald-400/30';
      },
      get maxGroup() { return Math.max(1, ...Object.values(this.groupCounts)); },
      get filteredSources() {
        return this.kindFilter ? this.sources.filter(s => s.kind === this.kindFilter) : this.sources;
      },
      get visibleSources() {
        return this.showAllSources ? this.filteredSources : this.filteredSources.slice(0, 12);
      },
      renderWithCitations(text) {
        if (!text) return '';
        const escaped = String(text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return escaped.replace(/\[(\d+)\]/g, (m, n) => {
          const idx = parseInt(n, 10);
          if (idx < 0 || idx >= this.sources.length) return m;
          return `<a href="#src-${idx}" class="inline-flex items-center px-1 rounded bg-brand-50 text-brand-700 text-[11px] font-mono no-underline hover:bg-brand-100">[${idx}]</a>`;
        });
      },
      findingClaim(f)        { return typeof f === 'string' ? f : (f && f.claim) || ''; },
      findingVerification(f) { return typeof f === 'object' && f ? (f.verification || '') : ''; },
      verifyClass(level) {
        return ({
          triple:      'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200',
          double:      'bg-brand-50 text-brand-700 ring-1 ring-brand-200',
          single:      'bg-amber-50 text-amber-700 ring-1 ring-amber-200',
          conflicting: 'bg-rose-50 text-rose-700 ring-1 ring-rose-200',
          unverified:  'bg-slate-100 text-slate-500 ring-1 ring-slate-200',
        })[level] || 'bg-slate-100 text-slate-500';
      },
      verifyIcon(level) {
        return ({ triple: '✓✓✓', double: '✓✓', single: '✓', conflicting: '⚠', unverified: '•' })[level] || '';
      },
      admiraltyClass(code) {
        if (!code || typeof code !== 'string') return 'bg-slate-100 text-slate-500 ring-slate-200';
        const r = code.charAt(0).toUpperCase();
        if (r === 'A' || r === 'B') return 'bg-emerald-50 text-emerald-700 ring-emerald-200';
        if (r === 'C') return 'bg-brand-50 text-brand-700 ring-brand-200';
        if (r === 'D') return 'bg-amber-50 text-amber-700 ring-amber-200';
        if (r === 'E') return 'bg-rose-50 text-rose-700 ring-rose-200';
        return 'bg-slate-100 text-slate-500 ring-slate-200';
      },
      riskScoreClass(score) {
        const s = Number(score) || 0;
        if (s >= 15) return 'bg-rose-100 text-rose-700 ring-1 ring-rose-300';
        if (s >= 8)  return 'bg-amber-100 text-amber-700 ring-1 ring-amber-300';
        if (s >= 4)  return 'bg-yellow-50 text-yellow-700 ring-1 ring-yellow-200';
        return 'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200';
      },
      achVerdictClass(verdict) {
        return ({
          'destekli':  'bg-emerald-100 text-emerald-700',
          'zayıf':     'bg-amber-100 text-amber-700',
          'elendi':    'bg-rose-100 text-rose-700',
        })[verdict] || 'bg-slate-100 text-slate-500';
      },
      statusClass(s) { return ({ pending: 'text-amber-600', running: 'text-brand-600', done: 'text-emerald-600', error: 'text-rose-600' })[s] || ''; },
      riskClass(level) {
        return level === 'high' ? 'bg-rose-50 ring-1 ring-rose-200 text-rose-700' :
               level === 'medium' ? 'bg-amber-50 ring-1 ring-amber-200 text-amber-700' :
               'bg-emerald-50 ring-1 ring-emerald-200 text-emerald-700';
      },
      strengthClass(s) {
        return s === 'strong' ? 'text-emerald-600' :
               s === 'weak' ? 'text-amber-600' : 'text-slate-400';
      },
      downloadJson() {
        const blob = new Blob([JSON.stringify({ job: this.job, sources: this.sources, report: this.report }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `osint-${this.jobId}.json`;
        a.click();
      },
      copyMarkdown() {
        const r = this.report; if (!r) return;
        const findingLine = f => {
          const claim = this.findingClaim(f);
          const v = this.findingVerification(f);
          const idx = (typeof f === 'object' && f && f.source_indices) ? ` ${f.source_indices.map(i=>`[${i}]`).join('')}` : '';
          return `- ${claim}${v ? ` (${v})` : ''}${idx}`;
        };
        const md = [
          `# ${this.job.target}`, ``,
          `**Risk:** ${r.executive_summary.risk_level} · **Güven:** ${(r.executive_summary.confidence*100).toFixed(0)}%`, ``,
          r.executive_summary.overview, ``,
          ...r.executive_summary.top_findings.map(findingLine), ``,
          `## Sonuç`, r.conclusion,
        ].join('\n');
        navigator.clipboard.writeText(md);
      },
      async loadImageCandidates() {
        if (this.imgCandidatesBusy) return;
        this.imgCandidatesBusy = true;
        try {
          const r = await fetch(`/api/research/${this.jobId}/image-candidates`, { credentials: 'include' });
          if (!r.ok) { this.imgCandidates = []; return; }
          const data = await r.json();
          this.imgCandidates = data.candidates || [];
        } catch (e) {
          this.imgCandidates = [];
        } finally {
          this.imgCandidatesBusy = false;
        }
      },
      selectCandidate(c) {
        this.selectedCandidate = c;
      },
      async runFaceSearchFromCandidate() {
        if (!this.selectedCandidate || this.faceSearchBusy) return;
        this.faceSearchBusy = true;
        this.faceResults = null;
        try {
          const r = await fetch('/api/image/face-search-url', {
            method: 'POST', credentials: 'include',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ url: this.selectedCandidate.full_url }),
          });
          if (!r.ok) {
            const txt = await r.text().catch(() => '');
            throw new Error(`HTTP ${r.status}: ${txt.slice(0, 200)}`);
          }
          this.faceResults = await r.json();
          // Sonuç paneline scroll
          this.$nextTick(() => {
            document.querySelectorAll('[x-show*="faceResults"]').forEach(el => {
              if (el.offsetParent) el.scrollIntoView({behavior: 'smooth', block: 'start'});
            });
          });
        } catch (e) {
          alert('Yüz araması hata aldı: ' + (e?.message || e));
        } finally {
          this.faceSearchBusy = false;
        }
      },
      get refineCount() {
        const r = this.refine;
        return ['handle','email','organization','location','phone','domain','note']
          .filter(k => (r[k] || '').trim()).length;
      },
      async submitRefine() {
        if (this.refine.busy) return;
        if (this.refineCount === 0) {
          this.refine.error = 'En az 1 alan doldur.';
          return;
        }
        this.refine.busy = true; this.refine.error = '';
        try {
          const ctx = {};
          for (const k of ['handle','email','organization','location','phone','domain','note']) {
            const v = (this.refine[k] || '').trim();
            if (v) ctx[k] = v;
          }
          const newJob = await window.app.api('/api/research', {
            method: 'POST',
            body: JSON.stringify({
              target: this.job.target,
              kind: this.job.kind,
              intensity: this.job.intensity || 'deep',
              scope: this.job.scope || 'all',
              parent_id: this.jobId,
              extra_context: ctx,
            }),
          });
          // SPA: parent (dashboard) içindeyse iframe parent'a postMessage
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'osint:open-report', jobId: newJob.id }, '*');
          } else {
            // Standalone /research/{id} sayfasındaysa direkt yönlendir
            window.location.href = `/research/${newJob.id}`;
          }
        } catch (e) {
          this.refine.error = e.message || 'Hata';
        } finally {
          this.refine.busy = false;
        }
      },
      async runFaceSearch() {
        // Yüz/görsel ile 10 dış adaptör paralel sorgulama (FaceCheck/PimEyes/
        // TinEye/Bing Visual/Google Vision/SauceNAO/Lenso/FaceSeek + Yandex/
        // Search4Faces). Settings'te key girilen adaptörler aktif.
        if (!this.imgFile || this.faceSearchBusy) return;
        this.faceSearchBusy = true;
        this.faceResults = null;
        try {
          const fd = new FormData();
          fd.append('image', this.imgFile);
          const r = await fetch('/api/image/face-search', {
            method: 'POST', body: fd, credentials: 'include',
          });
          if (!r.ok) {
            const text = await r.text().catch(() => '');
            throw new Error(`HTTP ${r.status}: ${text.slice(0, 200)}`);
          }
          this.faceResults = await r.json();
        } catch (e) {
          alert('Yüz araması hata aldı: ' + (e?.message || e));
        } finally {
          this.faceSearchBusy = false;
        }
      },
      faceConfidenceClass(c) {
        return ({
          'CERTAIN':    'bg-emerald-100 text-emerald-800 ring-1 ring-emerald-300',
          'CONFIDENT':  'bg-brand-100 text-brand-800 ring-1 ring-brand-300',
          'UNCERTAIN':  'bg-amber-100 text-amber-800 ring-1 ring-amber-300',
          'WEAK':       'bg-orange-100 text-orange-800 ring-1 ring-orange-300',
          'NONE':       'bg-slate-100 text-slate-500 ring-1 ring-slate-200',
        })[c] || 'bg-slate-100 text-slate-500';
      },
      async downloadPdf() {
        // Server-side render: text-search'lü, sayfa-uyumlu, profesyonel rapor
        // (eski html2pdf screenshot tarzı yaklaşım kaldırıldı — bölünme/eksik içerik yapıyordu)
        if (this.pdfBusy) return;
        this.pdfBusy = true;
        try {
          const url = `/api/research/${this.jobId}/export.pdf`;
          const r = await fetch(url, { credentials: 'include' });
          if (!r.ok) {
            const errText = await r.text().catch(() => '');
            throw new Error(`HTTP ${r.status}: ${errText.slice(0, 200)}`);
          }
          const blob = await r.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const safeName = (this.job.target || 'rapor').replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 40);
          a.href = blobUrl;
          a.download = `osint-${this.jobId}-${safeName}.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        } catch (e) {
          alert('PDF üretimi başarısız: ' + (e?.message || e));
        } finally {
          this.pdfBusy = false;
        }
      },
    };
  }
</script>
