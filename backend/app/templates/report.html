{% extends "base.html" %}
{% block title %}Rapor{% endblock %}
{% block content %}
<section class="mx-auto max-w-7xl px-4 sm:px-6 pt-6 sm:pt-10 pb-16" x-data="reportView({{ job_id }})" x-init="poll()">
  <a href="/dashboard" class="text-xs text-slate-500 hover:text-slate-700">← Panel</a>

  <div x-show="!job" class="mt-12 text-center text-slate-400 text-sm">Yükleniyor…</div>

  <template x-if="job">
    <div class="mt-3">
      <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight break-words" x-text="job.target"></h1>
        <span class="text-[11px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-100 text-slate-600" x-text="job.kind"></span>
        <span :class="statusClass(job.status)" class="text-[11px] uppercase font-medium tracking-wider" x-text="job.status"></span>
        <span class="ml-auto text-[11px] text-slate-400 font-mono" x-text="job.used_llm || ''"></span>
      </div>

      <!-- progress -->
      <div x-show="job.status === 'pending' || job.status === 'running'" class="mt-6 rounded-2xl bg-white ring-1 ring-brand-200 p-5">
        <div class="flex items-center gap-3">
          <div class="size-2.5 rounded-full bg-brand-500 animate-pulse"></div>
          <div class="text-sm font-medium">Açık kaynaklarda taranıyor…</div>
        </div>
        <div class="mt-2 text-xs text-slate-500">Web · Wiki · Wayback · GitHub · HN · Reddit · Sosyal</div>
      </div>

      <!-- error -->
      <div x-show="job.status === 'error'" class="mt-6 rounded-2xl bg-rose-50 ring-1 ring-rose-200 p-5">
        <div class="font-medium text-rose-700 text-sm">Hata</div>
        <pre class="text-xs text-rose-600/80 mt-1 whitespace-pre-wrap" x-text="job.error"></pre>
      </div>

      <template x-if="job.status === 'done' && report">
        <div class="mt-6 grid lg:grid-cols-[1fr_280px] gap-5">
          <div class="space-y-4 min-w-0">
            <!-- A. Yönetici Özeti -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">A · Özet</div>
              <p class="mt-3 text-[15px] text-slate-800 leading-relaxed" x-text="report.executive_summary.overview"></p>
              <ul class="mt-4 space-y-1.5 text-sm text-slate-700">
                <template x-for="(f,i) in report.executive_summary.top_findings" :key="i">
                  <li class="flex gap-2"><span class="text-brand-500 shrink-0">▸</span><span x-text="f"></span></li>
                </template>
              </ul>
              <div class="mt-4 flex flex-wrap gap-2 text-xs">
                <div class="px-2.5 py-1 rounded-lg bg-slate-50 ring-1 ring-slate-200">
                  Güven: <span class="font-mono font-semibold" x-text="(report.executive_summary.confidence*100).toFixed(0)+'%'"></span>
                </div>
                <div class="px-2.5 py-1 rounded-lg" :class="riskClass(report.executive_summary.risk_level)">
                  Risk: <span class="font-mono font-semibold uppercase" x-text="report.executive_summary.risk_level"></span>
                </div>
              </div>
            </div>

            <!-- B. Kim/Ne -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">B · Kim / Ne</div>
              <p class="mt-3 text-sm text-slate-800" x-text="report.identity.definition"></p>
              <div class="mt-3 grid gap-1.5 text-xs">
                <div><span class="text-slate-500">Bağlam:</span> <span x-text="report.identity.context"></span></div>
                <div><span class="text-slate-500">Eş isim riski:</span> <span x-text="report.identity.name_collision_risk"></span></div>
              </div>
              <ul class="mt-3 text-sm text-slate-700 list-disc list-inside" x-show="report.identity.known_links?.length">
                <template x-for="(l,i) in report.identity.known_links" :key="i"><li x-text="l"></li></template>
              </ul>
            </div>

            <!-- C. Dijital İz -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">C · Dijital İz</div>
              <dl class="mt-3 grid sm:grid-cols-2 gap-2 text-sm">
                <template x-for="(v,k) in report.digital_footprint" :key="k">
                  <div class="rounded-xl bg-slate-50 p-3">
                    <dt class="text-[10px] uppercase tracking-wider text-slate-500" x-text="k"></dt>
                    <dd class="mt-1 text-slate-800" x-text="v"></dd>
                  </div>
                </template>
              </dl>
            </div>

            <!-- D. Zaman Çizelgesi -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">D · Zaman Çizelgesi</div>
              <ol class="mt-3 relative border-l-2 border-slate-100 ml-2 space-y-3">
                <template x-for="(e,i) in report.timeline" :key="i">
                  <li class="ml-4 relative">
                    <div class="absolute -left-[22px] top-1.5 size-2.5 rounded-full bg-brand-500 ring-4 ring-white"></div>
                    <div class="text-[11px] font-mono text-brand-600" x-text="e.date"></div>
                    <div class="text-sm text-slate-800" x-text="e.event"></div>
                  </li>
                </template>
                <li x-show="report.timeline.length===0" class="ml-4 text-slate-400 text-sm">Tarihli bulgu yok</li>
              </ol>
            </div>

            <!-- E. İlişki -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">E · İlişkiler</div>
              <div class="mt-3 grid sm:grid-cols-2 gap-2">
                <template x-for="(r,i) in report.relations" :key="i">
                  <div class="rounded-xl bg-slate-50 p-3 text-sm">
                    <div class="font-medium text-slate-800 truncate" x-text="r.entity"></div>
                    <div class="text-xs text-slate-500 truncate" x-text="r.relation"></div>
                    <div class="text-[10px] uppercase tracking-wider mt-1" :class="strengthClass(r.strength)" x-text="r.strength"></div>
                  </div>
                </template>
                <div x-show="report.relations.length===0" class="text-slate-400 text-sm">İlişki yok</div>
              </div>
            </div>

            <!-- F. İçerik -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">F · İçerik</div>
              <div class="mt-3 grid sm:grid-cols-2 gap-2 text-sm">
                <div class="rounded-xl bg-slate-50 p-3">
                  <div class="text-[10px] uppercase tracking-wider text-slate-500">Ana iddia</div>
                  <div class="mt-0.5 text-slate-800" x-text="report.content_analysis.main_claim"></div>
                </div>
                <div class="rounded-xl bg-slate-50 p-3">
                  <div class="text-[10px] uppercase tracking-wider text-slate-500">Ton</div>
                  <div class="mt-0.5 text-slate-800" x-text="report.content_analysis.tone"></div>
                </div>
                <div class="rounded-xl bg-slate-50 p-3">
                  <div class="text-[10px] uppercase tracking-wider text-slate-500">Manipülasyon</div>
                  <div class="mt-0.5 text-slate-800" x-text="report.content_analysis.manipulation_risk"></div>
                </div>
                <div class="rounded-xl bg-slate-50 p-3">
                  <div class="text-[10px] uppercase tracking-wider text-slate-500">Doğrulanabilirlik</div>
                  <div class="mt-0.5 font-mono text-slate-800" x-text="(report.content_analysis.verifiability*100).toFixed(0)+'%'"></div>
                </div>
              </div>
            </div>

            <!-- G. Risk -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">G · Risk</div>
              <dl class="mt-3 grid sm:grid-cols-2 gap-2 text-sm">
                <template x-for="(v,k) in report.risk" :key="k">
                  <div class="rounded-xl bg-slate-50 p-3">
                    <dt class="text-[10px] uppercase tracking-wider text-slate-500" x-text="k"></dt>
                    <dd class="mt-1 text-slate-800" x-text="v"></dd>
                  </div>
                </template>
              </dl>
            </div>

            <!-- H. Kaynak Tablosu -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">H · Kaynaklar</div>
              <div class="mt-3 -mx-2 overflow-auto">
                <table class="w-full text-xs">
                  <thead class="text-slate-500">
                    <tr><th class="text-left px-2 py-1.5">#</th><th class="text-left px-2 py-1.5">Kaynak</th><th class="text-left px-2 py-1.5">Başlık</th><th class="text-left px-2 py-1.5">Tarih</th><th class="text-left px-2 py-1.5">Güven</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="(s,i) in sources" :key="i">
                      <tr class="border-t border-slate-100">
                        <td class="px-2 py-1.5 text-slate-400" x-text="i"></td>
                        <td class="px-2 py-1.5 text-slate-600 font-mono" x-text="s.source"></td>
                        <td class="px-2 py-1.5"><a :href="s.url" target="_blank" class="text-brand-600 hover:underline" x-text="s.title || s.url"></a></td>
                        <td class="px-2 py-1.5 text-slate-500 font-mono" x-text="s.published_at || '—'"></td>
                        <td class="px-2 py-1.5 font-mono text-slate-500" x-text="(s.confidence*100).toFixed(0)+'%'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- I. Sonuç -->
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-5">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">I · Sonuç</div>
              <p class="mt-3 text-sm text-slate-800" x-text="report.conclusion"></p>
              <div class="mt-4 grid sm:grid-cols-2 gap-3 text-sm">
                <div>
                  <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Açık sorular</div>
                  <ul class="list-disc list-inside space-y-0.5 text-slate-700">
                    <template x-for="(q,i) in report.open_questions" :key="i"><li x-text="q"></li></template>
                  </ul>
                </div>
                <div>
                  <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Sonraki adımlar</div>
                  <ul class="list-disc list-inside space-y-0.5 text-slate-700">
                    <template x-for="(q,i) in report.next_steps" :key="i"><li x-text="q"></li></template>
                  </ul>
                </div>
              </div>
            </div>
          </div>

          <!-- aside -->
          <aside class="space-y-3">
            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-4">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">İndir</div>
              <div class="mt-2 grid grid-cols-2 gap-2">
                <button @click="downloadJson()" class="text-xs rounded-lg ring-1 ring-slate-200 px-3 py-1.5 hover:bg-slate-50">JSON</button>
                <button @click="copyMarkdown()" class="text-xs rounded-lg ring-1 ring-slate-200 px-3 py-1.5 hover:bg-slate-50">Markdown</button>
              </div>
            </div>

            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-4">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">Görsel ters arama</div>
              <input type="url" x-model="imgUrl" placeholder="https://…/image.jpg" class="mt-2 w-full rounded-lg bg-slate-50 ring-1 ring-slate-200 px-2.5 py-1.5 text-xs" />
              <div class="mt-2 flex flex-wrap gap-1.5 text-[11px]">
                <a :href="`https://lens.google.com/uploadbyurl?url=${encodeURIComponent(imgUrl)}`" target="_blank" class="px-2 py-1 rounded ring-1 ring-slate-200 hover:bg-slate-50">Lens</a>
                <a :href="`https://yandex.com/images/search?rpt=imageview&url=${encodeURIComponent(imgUrl)}`" target="_blank" class="px-2 py-1 rounded ring-1 ring-slate-200 hover:bg-slate-50">Yandex</a>
                <a :href="`https://www.tineye.com/search?url=${encodeURIComponent(imgUrl)}`" target="_blank" class="px-2 py-1 rounded ring-1 ring-slate-200 hover:bg-slate-50">TinEye</a>
              </div>
            </div>

            <div class="rounded-2xl bg-white ring-1 ring-slate-200 p-4">
              <div class="text-[11px] uppercase tracking-widest text-brand-600 font-semibold">Dağılım</div>
              <div class="mt-2 space-y-1.5 text-[11px]">
                <template x-for="(c,k) in groupCounts" :key="k">
                  <div class="flex items-center gap-2">
                    <span class="w-16 text-slate-500" x-text="k"></span>
                    <div class="flex-1 h-1.5 rounded bg-slate-100 overflow-hidden">
                      <div class="h-full bg-gradient-to-r from-brand-500 to-fuchsia-500" :style="`width:${(c/maxGroup)*100}%`"></div>
                    </div>
                    <span class="font-mono w-5 text-right text-slate-600" x-text="c"></span>
                  </div>
                </template>
              </div>
            </div>
          </aside>
        </div>
      </template>
    </div>
  </template>
</section>

<script>
  function reportView(jobId) {
    return {
      jobId, job: null, report: null, sources: [], imgUrl: '',
      timer: null,
      async fetch() {
        try {
          this.job = await window.app.api(`/api/research/${this.jobId}`);
          if (this.job.result) { this.report = this.job.result.report; this.sources = this.job.result.sources || []; }
        } catch (e) {}
      },
      async poll() {
        await this.fetch();
        if (this.job && (this.job.status === 'pending' || this.job.status === 'running')) {
          this.timer = setTimeout(() => this.poll(), 2200);
        }
      },
      get groupCounts() {
        const c = {};
        for (const s of this.sources) c[s.kind] = (c[s.kind] || 0) + 1;
        return c;
      },
      get maxGroup() { return Math.max(1, ...Object.values(this.groupCounts)); },
      statusClass(s) { return ({ pending: 'text-amber-600', running: 'text-brand-600', done: 'text-emerald-600', error: 'text-rose-600' })[s] || ''; },
      riskClass(level) {
        return level === 'high' ? 'bg-rose-50 ring-1 ring-rose-200 text-rose-700' :
               level === 'medium' ? 'bg-amber-50 ring-1 ring-amber-200 text-amber-700' :
               'bg-emerald-50 ring-1 ring-emerald-200 text-emerald-700';
      },
      strengthClass(s) {
        return s === 'strong' ? 'text-emerald-600' :
               s === 'weak' ? 'text-amber-600' : 'text-slate-400';
      },
      downloadJson() {
        const blob = new Blob([JSON.stringify({ job: this.job, sources: this.sources, report: this.report }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `osint-${this.jobId}.json`;
        a.click();
      },
      copyMarkdown() {
        const r = this.report; if (!r) return;
        const md = [
          `# ${this.job.target}`, ``,
          `**Risk:** ${r.executive_summary.risk_level} · **Güven:** ${(r.executive_summary.confidence*100).toFixed(0)}%`, ``,
          r.executive_summary.overview, ``,
          ...r.executive_summary.top_findings.map(f => `- ${f}`), ``,
          `## Sonuç`, r.conclusion,
        ].join('\n');
        navigator.clipboard.writeText(md);
      },
    };
  }
</script>
{% endblock %}
