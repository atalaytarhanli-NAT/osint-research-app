{% extends "base.html" %}
{% block title %}Araştır{% endblock %}
{% block content %}
<section class="mx-auto max-w-5xl px-4 sm:px-6 pt-8 sm:pt-12 pb-16" x-data="researchPanel()">
  <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Araştır</h1>

  <form @submit.prevent="submit" class="mt-6 grid gap-2 sm:grid-cols-[1fr_auto_auto]">
    <input type="text" x-model="target" required placeholder="İsim, kurum, @kullanici, URL, kelime…"
      class="rounded-xl bg-white ring-1 ring-slate-200 focus:ring-brand-400 focus:ring-2 px-4 py-3 outline-none placeholder:text-slate-400" />
    <select x-model="kind" class="rounded-xl bg-white ring-1 ring-slate-200 focus:ring-brand-400 focus:ring-2 px-3 py-3 outline-none text-sm">
      <option value="auto">Auto</option>
      <option value="person">Kişi</option>
      <option value="organization">Kurum</option>
      <option value="social">Sosyal</option>
      <option value="url">URL</option>
      <option value="keyword">Kelime</option>
    </select>
    <button :disabled="loading" type="submit"
      class="rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-50 text-white font-medium px-5 py-3">
      <span x-show="!loading">Ara →</span>
      <span x-show="loading">…</span>
    </button>
  </form>

  <div class="mt-3 flex items-center gap-2 text-xs text-slate-500">
    <select x-model="provider" class="rounded-lg bg-white ring-1 ring-slate-200 px-2 py-1.5 text-xs">
      <option value="">LLM: otomatik</option>
      {% for p in providers %}
        <option value="{{ p.id }}">{{ p.name }}{% if p.free_tier %} · ücretsiz{% endif %}</option>
      {% endfor %}
    </select>
    <a href="/settings" class="ml-auto text-brand-600 hover:underline">Anahtar ekle →</a>
  </div>

  <p x-show="error" x-text="error" class="mt-3 text-rose-600 text-sm"></p>

  <div class="mt-12">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-semibold text-slate-700">Son aramalar</h2>
      <a href="/history" class="text-xs text-brand-600 hover:underline">Tümü</a>
    </div>
    <div class="grid sm:grid-cols-2 gap-2.5">
      <template x-for="job in jobs" :key="job.id">
        <a :href="`/research/${job.id}`"
          class="rounded-xl bg-white ring-1 ring-slate-200 hover:ring-brand-300 hover:shadow-sm transition p-4">
          <div class="flex items-center gap-2 text-[11px]">
            <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 uppercase tracking-wider" x-text="job.kind"></span>
            <span :class="statusClass(job.status)" class="font-medium uppercase tracking-wider" x-text="job.status"></span>
            <span class="ml-auto text-slate-400" x-text="formatDate(job.created_at)"></span>
          </div>
          <div class="font-medium text-slate-900 mt-1.5 truncate" x-text="job.target"></div>
          <div class="text-[11px] text-slate-400 mt-0.5" x-text="job.used_llm || ''"></div>
        </a>
      </template>
      <div x-show="jobs.length === 0" class="col-span-full text-center text-sm text-slate-400 py-8">
        Henüz arama yok
      </div>
    </div>
  </div>
</section>

<script>
  function researchPanel() {
    return {
      target: '', kind: 'auto', provider: '', loading: false, error: '', jobs: [],
      async init() { await this.load(); },
      async load() { try { this.jobs = await window.app.api('/api/research'); } catch (e) {} },
      async submit() {
        this.loading = true; this.error = '';
        try {
          const job = await window.app.api('/api/research', {
            method: 'POST',
            body: JSON.stringify({ target: this.target, kind: this.kind, provider: this.provider || null }),
          });
          window.location.href = `/research/${job.id}`;
        } catch (e) { this.error = e.message || 'Hata'; }
        finally { this.loading = false; }
      },
      statusClass(s) {
        return ({ pending: 'text-amber-600', running: 'text-brand-600', done: 'text-emerald-600', error: 'text-rose-600' })[s] || 'text-slate-500';
      },
      formatDate(iso) {
        try { return new Date(iso).toLocaleDateString('tr-TR', { day: '2-digit', month: 'short' }); } catch { return ''; }
      },
    };
  }
</script>
{% endblock %}
