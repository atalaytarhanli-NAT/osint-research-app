<!doctype html>
<html lang="tr" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}OSINT Research{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              50:  '#eef9ff',
              100: '#d8efff',
              200: '#b9e3ff',
              300: '#88d2ff',
              400: '#52b8ff',
              500: '#2698ff',
              600: '#0e78ed',
              700: '#0c61c0',
              800: '#0f5198',
              900: '#11447a',
            },
          },
        },
      },
    };
  </script>
</head>
<body class="font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500/30">
  <div
    class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(60%_60%_at_50%_0%,rgba(38,152,255,0.18),transparent_60%),radial-gradient(40%_40%_at_100%_100%,rgba(132,38,255,0.12),transparent_55%)]"
  ></div>
  {% block nav %}
    {% if user %}
      {% include "_nav.html" %}
    {% endif %}
  {% endblock %}

  <main class="flex-1">{% block content %}{% endblock %}</main>

  <footer class="mt-12 border-t border-white/5 py-6 text-center text-xs text-slate-500">
    OSINT Research App · yalnızca açık kaynak verileriyle çalışır · KVKK/GDPR uyumu kullanıcının
    sorumluluğundadır
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
